name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-retrieval.txt
      - name: Install local retrieval bridge
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-retrieval.txt
      - uses: actions/cache@v4
        with:
          path: runtime-harness/models
          key: retrieval-models-${{ hashFiles('requirements-retrieval.txt') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit
      - name: Build frontend
        run: npm run build
      - name: Check Rust release build
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --release
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
