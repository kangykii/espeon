name: Bug report
description: Report a reproducible Espeon defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, account numbers, private broker logs, or personal trading records."
  - type: input
    id: version
    attributes:
      label: Espeon version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior, with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Simulated
        - cTrader Demo
        - cTrader Live
        - Other
    validations:
      required: true
